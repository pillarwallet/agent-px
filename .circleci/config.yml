version: 2.1

jobs:
  e2e-tests:
    docker:
      - image: mcr.microsoft.com/playwright:v1.50.0-jammy

    environment:
      PLAYWRIGHT_JSON_OUTPUT_NAME: ".last-run.json"

    steps:
      - checkout


      - run:
          name: Install jq
          command: |
            apt-get update
            apt-get install -y jq

      - run:
          name: Install Dependencies
          command: npm ci

      - run:
          name: Run Playwright Tests
          command: |
            npx playwright test || true

      - store_artifacts:
          path: playwright-report
          destination: playwright-report


      - run:
          name: Move last-run.json to tmp
          command: |
            mkdir -p /tmp/test-results
            cp test-results/.last-run.json /tmp/test-results/.last-run.json || true

      - store_artifacts:
          path: /tmp/test-results
          destination: test-results

      - run:
          name: Send Slack Notification
          when: always
          command: |
            RESULTS_FILE="/tmp/test-results/.last-run.json"

            if [ ! -f "$RESULTS_FILE" ]; then
              echo "No results file found, skipping Slack."
              exit 0
            fi

            # Fetch signed artifact URL (correct method)
            ARTIFACT_URL=$(curl -s -H "Circle-Token: $CIRCLECI_TOKEN" \
              "https://circleci.com/api/v2/project/github/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/${CIRCLE_BUILD_NUM}/artifacts" \
              | jq -r '.items[] | select(.path | contains("playwright-report/index.html")) | .url')

            STATUS=$(jq -r '.status' $RESULTS_FILE)
            FAILED_TESTS=$(jq -r '.failedTests | join(", ")' $RESULTS_FILE)

            if [ "$STATUS" == "passed" ]; then
              SLACK_MESSAGE=":white_check_mark: *Playwright Tests Passed*\n*Report:* <${ARTIFACT_URL}|View Report>"
            else
              SLACK_MESSAGE=":x: *Playwright Tests Failed*\n*Failed:* ${FAILED_TESTS}\n*Report:* <${ARTIFACT_URL}|View Report>"
            fi

            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"${SLACK_MESSAGE//$'\n'/\\n}\"}" \
              $E2E_SLACK_WEBHOOK_URL

workflows:
  e2e:
    jobs:
      - e2e-tests
