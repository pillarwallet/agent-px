<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PillarX</title>
    <style>
      html {
        margin: 0;
        width: 100vw;
        min-width: 409px;
        height: 100vh;
        min-height: 1014px;
        background: #000;
        background-color: #000;
        color-scheme: dark;
        border: 0;
        outline: 0;
        overflow-x: hidden;
        overflow-y: auto;
      }

      body {
        margin: 0;
        width: 100vw;
        min-width: 409px;
        height: 100%;
        min-height: 1014px;
        background: #000;
        background-color: #000;
        border: 0;
        outline: 0;
        overflow-x: hidden;
        overflow-y: hidden;
      }

      #root {
        width: 100vw;
        min-width: 409px;
        height: 100%;
        min-height: 1014px;
        background: #000;
        background-color: #000;
        border: 0;
        outline: 0;
        overflow-x: hidden;
        overflow-y: hidden;
      }

      html,
      body,
      #root {
        scrollbar-width: none;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      #root::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      * {
        scrollbar-width: none;
        scrollbar-color: transparent transparent;
      }

      *::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/extension/popup.tsx"></script>
  </body>
</html>
