<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PillarX Approval</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        min-width: 390px;
        min-height: 100vh;
        background: #050507;
        overflow: hidden;
      }

      * {
        box-sizing: border-box;
        scrollbar-color: rgba(255, 255, 255, 0.28) transparent;
        scrollbar-width: thin;
      }

      *::-webkit-scrollbar {
        width: 4px;
      }

      *::-webkit-scrollbar-track {
        background: transparent;
      }

      *::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.28);
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/extension/approval.tsx"></script>
  </body>
</html>
